# 日本語のエラーメッセージ・項目名
# エラーは「項目名＋メッセージ」の形で表示する（例：タイトルを入力してください）
ja:
  # APIのエラーメッセージ（docs/api.md 3.2、docs/screens.md 6章）
  api:
    errors:
      bad_request: リクエストの形式が正しくありません
      not_found: 対象が見つかりません
      record_not_found: "%{model}が見つかりません"
      shelf_not_empty: 書籍が残っているため削除できません。別の本棚へ移動するか削除してください
      last_shelf: 本棚が1つしかないため削除できません
      validation_failed: 入力内容に誤りがあります
  activerecord:
    models:
      shelf: 本棚
      book: 書籍
      tag: タグ
    attributes:
      shelf:
        name: 本棚名
      book:
        shelf: 本棚
        shelf_id: 本棚
        title: タイトル
        author: 著者名
        cover_image_url: 書影URL
        status: ステータス
        position: 並び順
        started_on: 読書開始日
        finished_on: 完了日
        rating: 評価
        memo: 感想メモ
        tag_names: タグ名
      tag:
        name: タグ名
        normalized_name: タグ名
    errors:
      messages:
        record_invalid: "入力内容に誤りがあります: %{errors}"
        restrict_dependent_destroy:
          has_one: "%{record}が存在しているので削除できません"
          has_many: "%{record}が存在しているので削除できません"
  errors:
    format: "%{attribute}%{message}"
    messages:
      blank: を入力してください
      present: は入力しないでください
      required: を入力してください
      taken: はすでに存在します
      too_long: は%{count}文字以内で入力してください
      inclusion: は一覧にありません
      invalid: は正しくありません
      not_a_number: は数値で入力してください
      not_an_integer: は整数で入力してください
      in: は%{count}の範囲で入力してください
      greater_than_or_equal_to: は%{count}以上の値にしてください
      not_found: が見つかりません
      # 独自のメッセージ（docs/api.md 5.2）
      only_done: は読了の書籍のみ入力できます
      unread_no_start: は未読の書籍には入力できません
      rating_range: は1〜5で入力してください
      http_url: は http:// または https:// で始まるURLを入力してください
